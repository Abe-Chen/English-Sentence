import org.gradle.process.ExecSpec

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id "com.diffplug.spotless"
    id "kotlin-parcelize"
    id "org.jetbrains.dokka"
    id "kotlin-kapt"
}

android {
    namespace 'org.oxycblt.musikr'
    compileSdk target_sdk
    ndkVersion "$ndk_version"

    defaultConfig {
        minSdk min_sdk
        targetSdk target_sdk

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += "-Xjvm-default=all"
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlin_coroutines_version"

    // AndroidX
    implementation "androidx.core:core-ktx:$core_version"

    // Database
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"

    // Build
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:$desugaring_version"

    // Testing
    testImplementation "junit:junit:4.13.2"
    testImplementation "io.mockk:mockk:1.13.7"
    testImplementation "org.robolectric:robolectric:4.11"
    testImplementation 'androidx.test:core-ktx:1.6.1'
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$kotlin_coroutines_version"
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

def taglibDir = file("${projectDir}/src/main/cpp/taglib")

tasks.register("assembleTaglib") {
    group = "build"
    description = "Builds the vendored TagLib static libraries required by Musikr."

    doLast {
        def pkgDir = file("${taglibDir}/pkg")
        if (pkgDir.exists()) {
            logger.lifecycle("TagLib packages already present at ${pkgDir}, skipping rebuild.")
            return
        }

        def cmakeFile = file("${taglibDir}/CMakeLists.txt")
        if (!cmakeFile.exists()) {
            def command = ["git", "submodule", "update", "--init", "--recursive", "musikr/src/main/cpp/taglib"]
            try {
                logger.lifecycle("Initializing TagLib submodule via `${command.join(' ')}`")
                project.exec { ExecSpec spec ->
                    spec.workingDir = rootDir
                    spec.commandLine command
                }
            } catch (Exception exception) {
                throw new GradleException("Failed to initialize the TagLib submodule.\n" +
                        "Please run `git submodule update --init --recursive musikr/src/main/cpp/taglib` manually and re-run the build.", exception)
            }
        }

        if (!cmakeFile.exists()) {
            throw new GradleException("Missing TagLib sources in ${taglibDir}. Ensure the git submodule is available.")
        }

        def ndkDir = android.ndkDirectory?.absolutePath
        if (!ndkDir) {
            throw new GradleException("Android NDK path is not configured. Set `ndkVersion` or install the requested NDK.")
        }

        project.exec {
            commandLine "sh", "${projectDir}/src/main/cpp/build_taglib.sh", "${projectDir}/src/main/cpp", ndkDir
        }
    }
}

afterEvaluate {
    tasks.matching { it.name.startsWith("pre") && it.name.endsWith("Build") }.configureEach {
        dependsOn tasks.named("assembleTaglib")
    }
}

tasks.named("clean") {
    doLast {
        delete "${projectDir}/src/main/cpp/taglib/pkg"
        delete "${projectDir}/src/main/cpp/taglib/build"
    }
}
